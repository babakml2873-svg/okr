services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: okr
    ports:
      - '5432:5432'
    volumes:
      - okr-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d okr']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/okr?schema=public
      # Override in production: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-with-a-long-random-string}
      NODE_ENV: production
    ports:
      - '3000:3000'
    # Apply migrations before serving, so a fresh volume comes up ready.
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  okr-db:
